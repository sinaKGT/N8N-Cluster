services:
  n8n-naziwork:
    image: n8nio/n8n:latest
    container_name: n8n-naziwork
    restart: always
    environment:
      - N8N_PORT=5678
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=naziwork.dtbros.co.uk
      - N8N_PROTOCOL=https
      - N8N_URL=https://naziwork.dtbros.co.uk
      - N8N_WEBHOOK_URL=https://naziwork.dtbros.co.uk
      - N8N_EDITOR_BASE_URL=https://naziwork.dtbros.co.uk
      - N8N_ALLOWED_ORIGINS=*
      - NODE_FUNCTION_ALLOW_BUILTIN=*
    volumes:
      - ../../volumes/n8n-naziwork:/home/node/.n8n
    networks:
      - default
