events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Docker's internal DNS — re-resolves container IPs every 30s.
    # Prevents stale routing after container restarts or recreations.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Main portal dashboard
    server {
        listen 80;
        server_name localhost n8ncluster.dtbros.co.uk;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
    }

    # n8n-baba — served at baba.dtbros.co.uk
    server {
        listen 80;
        server_name baba.localhost baba.dtbros.co.uk;

        location / {
            proxy_pass http://n8n-baba:5678;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_buffering off;
        }
    }

    # n8n-phd — served at phd.dtbros.co.uk
    server {
        listen 80;
        server_name phd.localhost phd.dtbros.co.uk;

