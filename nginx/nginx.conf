    # n8n-personal — served at personal.dtbros.co.uk
    server {
        listen 80;
        server_name personal.localhost personal.dtbros.co.uk;

        location / {
            proxy_pass http://n8n-personal:5678;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_buffering off;
        }
    }
    # n8n-naziwork environment — served at naziwork.dtbros.co.uk
    server {
        listen 80;
        server_name naziwork.localhost naziwork.dtbros.co.uk;

        # AHP dashboard — static HTML served directly by nginx
        location /ahp-dashboard/ {
            alias /usr/share/nginx/dependency/ahp-dashboard/;
            index AHP_Dashboard.html;
            try_files $uri $uri/ /ahp-dashboard/AHP_Dashboard.html;
        }

        location / {
            proxy_pass http://n8n-naziwork:5678;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
